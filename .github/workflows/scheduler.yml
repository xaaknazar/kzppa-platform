# Планировщик фоновых операций (ARCH-03, MAIL-03): почта комиссии, очередь писем,
# закрытие истёкших голосований — каждые 5 минут (GitHub может запускать с задержкой).
# Собственные cron-задачи Vercel на текущем тарифе — только раз в сутки (vercel.json).
#   GET https://kzppa-platform.vercel.app/api/cron/mail-sync   и   /api/cron/outbox
#   заголовок Authorization: Bearer <CRON_SECRET>. Нужен секрет репозитория CRON_SECRET.
name: scheduler
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: scheduler
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Синхронизация почты и фоновые операции
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://kzppa-platform.vercel.app' }}
        run: |
          # Без секрета задание пропускается, не падая (иначе GitHub шлёт письмо о сбое каждый час).
          if [ -z "$CRON_SECRET" ]; then echo "::notice::Секрет CRON_SECRET не задан — пропуск"; exit 0; fi
          for path in api/cron/mail-sync api/cron/outbox; do
            code=$(curl -sS --max-time 70 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/$path")
            echo "$path → $code"
            if [ "$code" = "401" ]; then echo "::error::Ключ CRON_SECRET не совпадает с Vercel"; exit 1; fi
          done
