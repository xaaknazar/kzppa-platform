# Частый планировщик фоновых операций платформы (ARCH-03, MAIL-03).
# На тарифе Vercel Hobby cron-задачи разрешены лишь раз в сутки, поэтому частые запуски
# выполняет GitHub Actions. Нужен секрет репозитория CRON_SECRET (то же значение, что в Vercel).
name: scheduler
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: scheduler
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Синхронизация почты комиссии
        run: |
          curl -fsS --max-time 70 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL || 'https://kzppa-platform.vercel.app' }}/api/cron/mail-sync" -o /dev/null -w "mail-sync %{http_code}\n" || true
      - name: Фоновые операции (повторы, сверка, подпись)
        run: |
          curl -fsS --max-time 70 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL || 'https://kzppa-platform.vercel.app' }}/api/cron/outbox" -o /dev/null -w "outbox %{http_code}\n" || true
