# Частый планировщик платформы: почта комиссии и очередь писем каждые 5 минут.
# Собственные cron-задачи Vercel на текущем тарифе запускаются только раз в сутки (vercel.json).
# Ключ — секрет репозитория TICK_TOKEN; в коде платформы хранится только его SHA-256.
name: Планировщик платформы
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Почта комиссии
        continue-on-error: true
        run: curl -fsS --max-time 75 -H "Authorization: Bearer ${{ secrets.TICK_TOKEN }}" "https://kzppa-platform.vercel.app/api/cron/tick?job=mail" | head -c 2000
      - name: Очередь писем и закрытие голосований
        continue-on-error: true
        run: curl -fsS --max-time 75 -H "Authorization: Bearer ${{ secrets.TICK_TOKEN }}" "https://kzppa-platform.vercel.app/api/cron/tick?job=outbox" | head -c 2000
